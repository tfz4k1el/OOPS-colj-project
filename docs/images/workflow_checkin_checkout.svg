<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="auto">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column 1: Check-In Flow -->
  <rect x="30" y="20" width="350" height="440" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="205" y="45" font-family="Times New Roman" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e40af">VEHICLE CHECK-IN WORKFLOW</text>

  <rect x="130" y="60" width="150" height="32" rx="16" fill="#2563eb" filter="url(#sh)"/>
  <text x="205" y="81" font-family="Times New Roman" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Vehicle Arrives at Gate</text>
  <line x1="205" y1="92" x2="205" y2="115" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="120" y="115" width="170" height="40" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" filter="url(#sh)"/>
  <text x="205" y="132" font-family="Times New Roman" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Operator Inputs Plate</text>
  <text x="205" y="146" font-family="Times New Roman" font-size="10.5" text-anchor="middle" fill="#64748b">&amp; Selects Type (Car / Bike)</text>
  <line x1="205" y1="155" x2="205" y2="180" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <polygon points="205,180 280,215 205,250 130,215" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2" filter="url(#sh)"/>
  <text x="205" y="212" font-family="Times New Roman" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#854d0e">Matching Slot</text>
  <text x="205" y="225" font-family="Times New Roman" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#854d0e">Available?</text>

  <line x1="280" y1="215" x2="330" y2="215" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="295" y="208" font-family="Times New Roman" font-size="10" font-weight="bold" fill="#dc2626">No</text>
  <rect x="295" y="230" width="75" height="35" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="332" y="246" font-family="Times New Roman" font-size="9" font-weight="bold" text-anchor="middle" fill="#991b1b">Display Alert:</text>
  <text x="332" y="258" font-family="Times New Roman" font-size="9" font-weight="bold" text-anchor="middle" fill="#991b1b">Lot Full</text>

  <line x1="205" y1="250" x2="205" y2="280" stroke="#15803d" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="215" y="268" font-family="Times New Roman" font-size="10" font-weight="bold" fill="#15803d">Yes</text>

  <rect x="115" y="280" width="180" height="42" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#sh)"/>
  <text x="205" y="298" font-family="Times New Roman" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Atomic State Transition</text>
  <text x="205" y="312" font-family="Times New Roman" font-size="10" text-anchor="middle" fill="#64748b">Slot Status = OCCUPIED (Red)</text>
  <line x1="205" y1="322" x2="205" y2="345" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="115" y="345" width="180" height="42" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" filter="url(#sh)"/>
  <text x="205" y="363" font-family="Times New Roman" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Generate Booking Record</text>
  <text x="205" y="377" font-family="Times New Roman" font-size="10" text-anchor="middle" fill="#64748b">Create TKT-ID &amp; Timestamp</text>
  <line x1="205" y1="387" x2="205" y2="410" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="130" y="410" width="150" height="32" rx="16" fill="#16a34a" filter="url(#sh)"/>
  <text x="205" y="431" font-family="Times New Roman" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Barrier Gate Opens</text>

  <!-- Column 2: Check-Out Flow -->
  <rect x="420" y="20" width="350" height="440" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="595" y="45" font-family="Times New Roman" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">VEHICLE CHECK-OUT &amp; BILLING WORKFLOW</text>

  <rect x="520" y="60" width="150" height="32" rx="16" fill="#16a34a" filter="url(#sh)"/>
  <text x="595" y="81" font-family="Times New Roman" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Vehicle Arrives at Exit</text>
  <line x1="595" y1="92" x2="595" y2="115" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="505" y="115" width="180" height="40" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#sh)"/>
  <text x="595" y="132" font-family="Times New Roman" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Lookup Active Booking</text>
  <text x="595" y="146" font-family="Times New Roman" font-size="10.5" text-anchor="middle" fill="#64748b">Query by Plate / Slot ID</text>
  <line x1="595" y1="155" x2="595" y2="180" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="495" y="180" width="200" height="48" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#sh)"/>
  <text x="595" y="199" font-family="Times New Roman" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Duration &amp; Tariff Engine</text>
  <text x="595" y="213" font-family="Times New Roman" font-size="10" text-anchor="middle" fill="#64748b">Hours = ceil(Minutes / 60)</text>
  <text x="595" y="225" font-family="Times New Roman" font-size="9.5" text-anchor="middle" fill="#047857">Polymorphic Fee = Hours * Rate</text>
  <line x1="595" y1="228" x2="595" y2="255" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="505" y="255" width="180" height="42" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#sh)"/>
  <text x="595" y="273" font-family="Times New Roman" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Payment Collection</text>
  <text x="595" y="287" font-family="Times New Roman" font-size="10" text-anchor="middle" fill="#64748b">Cash / Card / UPI Recorded</text>
  <line x1="595" y1="297" x2="595" y2="322" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="505" y="322" width="180" height="42" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#sh)"/>
  <text x="595" y="340" font-family="Times New Roman" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Slot Release &amp; Refresh</text>
  <text x="595" y="354" font-family="Times New Roman" font-size="10" text-anchor="middle" fill="#64748b">Slot Status = AVAILABLE (Green)</text>
  <line x1="595" y1="364" x2="595" y2="390" stroke="#1e293b" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="495" y="390" width="200" height="35" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#sh)"/>
  <text x="595" y="407" font-family="Times New Roman" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Issue Receipt &amp; Open Gate</text>
  <text x="595" y="419" font-family="Times New Roman" font-size="9" text-anchor="middle" fill="#64748b">Append to Persistent Audit Log</text>
</svg>